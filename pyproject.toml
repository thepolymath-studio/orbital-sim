[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-sim"
version = "0.1.0"
description = "Orbital mechanics for @thepolymath.studio: tested, phone-readable code behind each post."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5,<2.6",
    "scipy>=1.16,<1.17",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
